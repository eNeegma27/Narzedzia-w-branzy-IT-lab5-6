# Name of the GitHub Actions workflow
name: Build Executable

# Triggers defining when this workflow should run
on:
  # 1. Trigger automatically when code is pushed to the master branch
  push:
    branches:
      - master

  # 2. Trigger automatically once a week (Sundays at 00:00 UTC) using CRON expression
  schedule:
    - cron: '0 0 * * 0'

  # 3. Trigger manually from the GitHub Actions tab in the web UI
  workflow_dispatch:

# The job list
jobs:
  build-and-upload:
    # Use the latest available Windows server environment
    runs-on: windows-latest

    # Set PowerShell (pwsh) as the default shell for all run steps
    defaults:
      run:
        shell: pwsh

    steps:
      # Step 1: Checkout the repository code into the runner env
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Stable python version compatible with PyInstaller & PyQt5

      # Step 3: Install Pip dependencies using your installResources.ps1 script
      - name: Install Dependencies
        run: .\installResources.ps1

      # Step 4: Build the single-file executable using PyInstaller
      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --onefile --noconsole main.py

      # Step 5: Upload the generated .exe artifact back to GitHub
      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v3
        with:
          name: data-converter-exe
          path: dist/main.exe
